<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SPCA Guardian Pro - Volunteer Engagement Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #134f5c;
    }

    .overlay {
      background: rgba(19, 79, 92, 0.85);
      min-height: 100vh;
      padding: 30px 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #134f5c;
    }

    form label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #134f5c;
    }

    form input, form select, form textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0 16px;
      border: 1px solid #134f5c;
      border-radius: 8px;
      font-size: 1rem;
    }

    form textarea {
      resize: vertical;
      min-height: 80px;
    }

    .button-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      background: #134f5c;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
      font-size: 16px;
    }

    .btn:hover {
      background: #0f3f4a;
    }

    .reset-btn {
      background: #60a5b3;
    }

    .reset-btn:hover {
      background: #3d8a95;
    }

    .back-btn {
      display: block;
      width: fit-content;
      background: #60a5b3;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin: 20px auto 0;
      text-align: center;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #3d8a95;
    }

    fieldset {
      border: none;
    }

    /* Hide 'Other' input by default */
    #other_activity_field {
      display: none;
      margin-top: 10px;
    }
  </style>
<link rel="stylesheet" href="spca-theme.css">
</head>
<body class="spca">
<script src="site-nav.js"></script>
  <div class="overlay">
    <div class="container">
      <h2>Log volunteer hours</h2>

      <fieldset>
        <form action="Community.php" method="POST">
          <p class="form-intro">Log the time you spent helping at the shelter.</p>

          <div class="two-col">
            <div><label for="volunteer_Fname">First name *</label>
            <input type="text" id="volunteer_Fname" name="volunteer_Fname" autocomplete="given-name" required></div>
            <div><label for="volunteer_Lname">Surname *</label>
            <input type="text" id="volunteer_Lname" name="volunteer_Lname" autocomplete="family-name" required></div>
          </div>

          <label for="contact_number">Phone number *</label>
          <input type="tel" id="contact_number" name="contact_number" autocomplete="tel" placeholder="e.g. 072 123 4567" required>

          <label for="email">Email *</label>
          <input type="email" id="email" name="email" autocomplete="email" required>

          <label for="activity_type">What did you do? *</label>
          <select name="activities_name" id="activity_type" required>
            <option value="">Choose an activity</option>
            <option value="Walking">Walking dogs</option>
            <option value="Feeding">Feeding</option>
            <option value="Hygiene Assistance">Cleaning and hygiene</option>
            <option value="Visiting">Visiting and socialising</option>
            <option value="Fostering">Fostering</option>
            <option value="Fundraising">Fundraising</option>
            <option value="Other">Something else</option>
          </select>

          <div id="other_activity_field">
            <label for="other_activity">Tell us what you did</label>
            <input type="text" id="other_activity" name="other_activity">
          </div>

          <label for="date">Date *</label>
          <input type="date" id="date" name="date" required>

          <div class="two-col">
            <div><label for="start_time">From *</label>
            <input type="time" name="start_time" id="start_time" required></div>
            <div><label for="end_time">To *</label>
            <input type="time" name="end_time" id="end_time" required></div>
          </div>
          <input type="hidden" name="lapse_time" id="elapsed_time">

          <div class="button-container">
            <button type="submit" class="btn">Log my hours</button>
            <a href="Homepage.html" class="back-btn">&larr; Back to home</a>
          </div>
        </form>
      </fieldset>
    </div>
  </div>

  <script>
    const start = document.getElementById("start_time");
    const end = document.getElementById("end_time");
    const elapsed = document.getElementById("elapsed_time");

    function calculateDifference() { 
      if (start.value && end.value) {
        let startDate = new Date("1970-01-01T" + start.value + ":00");
        let endDate = new Date("1970-01-01T" + end.value + ":00");

        if (endDate < startDate) {
          endDate.setDate(endDate.getDate() + 1);
        }

        let diffMs = endDate - startDate;
        let diffHrs = Math.floor(diffMs / 1000 / 60 / 60);
        let diffMins = Math.floor((diffMs / 1000 / 60) % 60);

        elapsed.value = diffHrs + " hours " + diffMins + " minutes";
      }
    }

    start.addEventListener("change", calculateDifference);
    end.addEventListener("change", calculateDifference);
    elapsed.addEventListener("click", calculateDifference);

    // Show/hide "Other" field
    const activityType = document.getElementById("activity_type");
    const otherField = document.getElementById("other_activity_field");

    activityType.addEventListener("change", function() {
      if (this.value === "Other") {
        otherField.style.display = "block";
      } else {
        otherField.style.display = "none";
      }
    });
  </script>
</body>
</html>
