<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimalGuardian - Search Animals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        .overlay {
            background: rgba(19, 79, 92, 0.85);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-box {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #e0f7fa;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background: #60a5fa;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #3b82f6;
        }

        .results-container {
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
            overflow-x: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .results-table th, .results-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .results-table th {
            background-color: rgba(19, 79, 92, 0.7);
            color: #e0f7fa;
            font-weight: bold;
        }

        .results-table tr:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .animal-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }

        .no-image {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #ccc;
            font-style: italic;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-available {
            background: rgba(76, 175, 80, 0.3);
            color: #8bc34a;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.3);
            color: #ffeb3b;
        }

        .status-unavailable {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
        }

        .status-adopted {
            background: rgba(33, 150, 243, 0.3);
            color: #90caf9;
        }

        .health-healthy {
            color: #8bc34a;
        }

        .health-unhealthy {
            color: #f44336;
        }

        .view-button {
            display: inline-block;
            padding: 6px 12px;
            background: #60a5fa;
            color: white;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .view-button:hover {
            background: #3b82f6;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }

        .no-results i {
            font-size: 3rem;
            color: #bdc3c7;
            margin-bottom: 15px;
        }

        .no-results p {
            color: #e0f7fa;
            font-size: 1.2rem;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            background: #60a5fa;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-btn:hover { 
            background: #3b82f6; 
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .loading-spinner {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #60a5fa;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .results-table {
                display: block;
                overflow-x: auto;
            }
            
            .search-box {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="search-box">
            <h1>Search Animals</h1>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Enter name, species, breed, color, or status..." required>
                <button type="submit">Search</button>
            </form>
        </div>
        
        <div class="results-container" id="results-container">
            <div class="no-results">
                <i class="fas fa-search"></i>
                <p>Enter a search term to find animals</p>
            </div>
        </div>
        
        <a href="admin dashboard.php" class="back-btn"> Back to dashboard</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('search-input');
            const resultsContainer = document.getElementById('results-container');
            
            // Function to perform search
            function performSearch(event) {
                if (event) event.preventDefault();
                
                const searchTerm = searchInput.value.trim();
                
                if (searchTerm === '') {
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-search"></i>
                            <p>Please enter a search term</p>
                        </div>
                    `;
                    return;
                }
                
                // Show loading state
                resultsContainer.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Searching for animals...</p>
                    </div>
                `;
                
                // Create AJAX request
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'search_animals.php', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                displayResults(response);
                            } catch (e) {
                                resultsContainer.innerHTML = `
                                    <div class="no-results">
                                        <i class="fas fa-exclamation-triangle"></i>
                                        <p>Error parsing results. Please try again.</p>
                                    </div>
                                `;
                            }
                        } else {
                            resultsContainer.innerHTML = `
                                <div class="no-results">
                                    <i class="fas fa-exclamation-triangle"></i>
                                    <p>Error fetching results. Please try again.</p>
                                </div>
                            `;
                        }
                    }
                };
                
                // Send the request with the search term
                xhr.send('search_term=' + encodeURIComponent(searchTerm));
            }
            
            // Function to display results in a table
            function displayResults(animals) {
                if (animals.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-frown"></i>
                            <p>No animals found matching your search</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Species</th>
                                <th>Breed</th>
                                <th>Age</th>
                                <th>Color</th>
                                <th>Health</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                animals.forEach(animal => {
                    // Determine status badge class
                    let statusClass = '';
                    switch(animal.status) {
                        case 'Available':
                            statusClass = 'status-available';
                            break;
                        case 'Pending':
                            statusClass = 'status-pending';
                            break;
                        case 'Not Available':
                            statusClass = 'status-unavailable';
                            break;
                        case 'Adopted':
                            statusClass = 'status-adopted';
                            break;
                    }
                    
                    // Format the table row
                    html += `
                        <tr>
                            <td>${animal.id}</td>
                            <td>
                                ${animal.animal_picture ? 
                                    `<img class="animal-image" src="${animal.animal_picture}" alt="${animal.Aname}">` : 
                                    '<div class="no-image">No Image</div>'
                                }
                            </td>
                            <td>${animal.Aname}</td>
                            <td>${animal.Species}</td>
                            <td>${animal.Animal_breed}</td>
                            <td>${animal.Aage} years</td>
                            <td>${animal.Color}</td>
                            <td class="health-${animal.Health_status.toLowerCase()}">${animal.Health_status}</td>
                            <td><span class="status-badge ${statusClass}">${animal.status}</span></td>
                            <td><a href="edit_animal.php?id=${animal.id}" class="view-button">Edit</a></td>
                        </tr>
                    `;
                });
                
                html += `
                        </tbody>
                    </table>
                `;
                
                resultsContainer.innerHTML = html;
            }
            
            // Event listeners
            searchForm.addEventListener('submit', performSearch);
        });
    </script>
    
    <!-- Font Awesome for icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
