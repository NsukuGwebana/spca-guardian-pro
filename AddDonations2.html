<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Donation | SPCA Guardian Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #134f5c;
    }

    .overlay {
      background: rgba(19,79,92,0.85);
      min-height: 100vh;
      padding: 30px 0;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #134f5c;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    input[readonly] {
      background-color: #f0f0f0;
      cursor: not-allowed;
    }

    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      background: #134f5c;
      color: #fff;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
      flex: 1;
      min-width: 120px;
    }

    .btn:hover {
      background: #0f3f4a;
      transform: translateY(-2px);
    }

    .reset-btn {
      background: #134f5c;
      flex: none;
      width: auto;
    }

    .back-btn {
      background: #60a5b3;
      flex: none;
      width: auto;
    }

    .cancel-back-btn {
      background: #60a5b3;
      flex: none;
      width: auto;
    }
  </style>
<link rel="stylesheet" href="spca-theme.css">
</head>
<body class="spca">
<script src="site-nav.js"></script>
  <div class="overlay">
    <div class="container">
      <h2>Make a donation</h2>
      <form action="addDonations2.php" method="POST">
        <p class="form-intro">Every rand feeds, shelters and heals an animal in our care.</p>

        <label for="amount">Amount (R) *</label>
        <input type="number" id="amount" name="amount" min="10" step="1" inputmode="numeric" placeholder="e.g. 200" required>

        <label for="type">How often?</label>
        <select id="type" name="type">
          <option value="one-time">Once</option>
          <option value="monthly">Every month</option>
        </select>

        <div class="two-col">
          <div><label for="fname">First name *</label>
          <input type="text" id="fname" name="fname" autocomplete="given-name" required></div>
          <div><label for="lname">Surname *</label>
          <input type="text" id="lname" name="lname" autocomplete="family-name" required></div>
        </div>

        <label for="email">Email for your receipt *</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <div class="btn-container">
          <button type="submit" class="btn">Continue to payment</button>
          <a href="Homepage.html" class="back-btn">&larr; Back to home</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
