<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Confirmation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400..800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'TASA Explorer', sans-serif;
            text-decoration: none;
            list-style: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(90deg, #e2e2e2, #134f5c);
        }

        .container {
            position: relative;
            width: 850px;
            height: 550px;
            background: #fff;
            margin: 20px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .logout-icon {
            font-size: 80px;
            color: #134f5c;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            color: #134f5c;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            max-width: 80%;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            background: #134f5c;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-cancel {
            background: transparent;
            border: 2px solid #134f5c;
            color: #134f5c;
        }

        .btn:hover {
            background: #0d3c46;
            transform: translateY(-2px);
        }

        .btn-cancel:hover {
            background: #f5f5f5;
        }

        .countdown {
            font-size: 16px;
            color: #888;
        }

        .countdown-number {
            font-weight: bold;
            color: #134f5c;
        }

        /* Back button styles */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2000;
            background: #134f5c;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #0d3c46;
            transform: translateY(-2px);
        }

        .back-button i {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back Button -->
        <a href="javascript:history.back()" class="back-button">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="logout-icon">
            <i class="fas fa-sign-out-alt"></i>
        </div>

        <h1></h1>
        <p>Are you sure you want to logout? You'll need to Log in again to access all features.</p>
        
        <div class="button-group">
            <button class="btn btn-cancel" onclick="goBack()">
                <i class="fas fa-times"></i> Cancel
            </button>
            <button class="btn" onclick="confirmLogout()">
                <i class="fas fa-sign-out-alt"></i> Yes, Logout
            </button>
        </div>
        
        <div class="countdown" id="countdown">Redirecting in <span class="countdown-number" id="countdown-number">10</span> seconds...</div>
    </div>

    <script>
        let countdown = 10;
        let countdownInterval;
        
        function startCountdown() {
            const countdownElement = document.getElementById('countdown-number');
            countdownElement.textContent = countdown;
            
            countdownInterval = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    window.location.href = 'Newlogin.html';
                }
            }, 1000);
        }
        
        function confirmLogout() {
            clearInterval(countdownInterval);
            window.location.href = 'Newlogin.html';
        }
        
        function goBack() {
            clearInterval(countdownInterval);
            window.history.back();
        }
        
        // Start the countdown when page loads
        window.onload = startCountdown;
    </script>
</body>
</html>
