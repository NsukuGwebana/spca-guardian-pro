<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruelty Reports Over Time</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        .overlay {
            background: rgba(19, 79, 92, 0.90);
            min-height: 100vh;
            padding: 30px;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e0f7fa;
        }

        .filter-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #60a5fa;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
        }

        .btn-primary {
            background-color: #60a5fa;
        }

        .btn-primary:hover {
            background-color: #3b82f6;
        }

        .btn-success {
            background-color: #10b981;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }

        #curve_chart {
            width: 100%;
            height: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
        }

        .back-btn {
            display: block;
            width: fit-content;
            background: #60a5fa;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            margin: 20px auto;
            text-align: center;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #3b82f6;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="overlay">
    <h1>Cruelty Reports Over Time</h1>
    
    <!-- Filter Form -->
    <div class="filter-form">
        <h2>Filter Reports</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="locationFilter">Location:</label>
                <select id="locationFilter">
                    <option value="">All Locations</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate">
            </div>
            
            <div class="form-group">
                <label for="endDate">End Date:</label>
                <input type="date" id="endDate">
            </div>
        </div>
        
        <div class="form-buttons">
            <button type="button" onclick="fetchData()" class="btn btn-primary">Apply Filters</button>
        </div>
    </div>
    
    <!-- Chart Container -->
    <div class="chart-container">
        <h2>Trend Analysis</h2>
        <div id="curve_chart"></div>
    </div>

    <a href="admin dashboard.php" class="back-btn">Back to Dashboard</a>
</div>

<script type="text/javascript">
    google.charts.load('current', {
        packages: ['corechart', 'line']
    });

    function drawChart(data) {
        // Debugging: Check the data before drawing the chart
        console.log("Data to be plotted:", data);
        
        var dataTable = new google.visualization.DataTable();
        dataTable.addColumn('string', 'Month');
        dataTable.addColumn('number', 'Reports');

        data.forEach(row => {
            dataTable.addRow([row.month, row.total_reports]);
        });

        var options = {
            title: 'Cruelty Reports Over Time',
            curveType: 'function',
            legend: { position: 'bottom' },
            backgroundColor: 'transparent',
            titleTextStyle: {
                color: '#e0f7fa'
            },
            hAxis: {
                textStyle: {
                    color: '#333'
                },
                titleTextStyle: {
                    color: '#333'
                }
            },
            vAxis: {
                textStyle: {
                    color: '#333'
                },
                titleTextStyle: {
                    color: '#333'
                }
            },
            legend: {
                textStyle: {
                    color: '#333'
                }
            }
        };

        var chart = new google.visualization.LineChart(document.getElementById('curve_chart'));
        chart.draw(dataTable, options);
    }

    function fetchData() {
        var location = document.getElementById('locationFilter').value;
        var startDate = document.getElementById('startDate').value;
        var endDate = document.getElementById('endDate').value;

        // Debugging: Check the filter values
        console.log("Location:", location, "Start Date:", startDate, "End Date:", endDate);

        // Fetch data from backend (use AJAX)
        fetch(`get_reports.php?location=${location}&start_date=${startDate}&end_date=${endDate}`)
            .then(response => response.json())
            .then(data => {
                // Debugging: Check the API response
                console.log("API Response:", data);

                if (data && Array.isArray(data) && data.length > 0) {
                    drawChart(data);
                } else {
                    alert("No data available for the selected filters.");
                }
            })
            .catch(error => {
                console.error("Error fetching data:", error);
            });
    }

    // Call fetchData when the page is loaded, or user interacts with the filter
    window.onload = function() {
        fetchData();  // Load data initially
    };
</script>
</body>
</html>
