<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway - AnimalGuardian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary-color: #134f5c; 
            --primary-light: #60a5b3; 
            --primary-dark: #0f3f4a; 
            --accent-color: #ff9f43; 
            --success-color: #27ae60; 
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --text-dark: #2c3e50;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            line-height: 1.6;
        }
        .overlay {
            background: linear-gradient(135deg, rgba(19,79,92,0.92) 0%, rgba(15,63,74,0.95) 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            margin: auto;
            padding: 30px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary-light);
        }
        .header h2 { color: var(--primary-color); margin-bottom: 10px; }
        .header p { color: var(--primary-dark); }
        .amount-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
            padding: 10px;
            background: var(--light-bg);
            border-radius: 10px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-dark); }
        .input-group { position: relative; }
        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: var(--transition);
        }
        .input-group input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(19, 79, 92, 0.2);
        }
        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-light);
        }
        .flex-group { display: flex; gap: 15px; }
        .flex-group .form-group { flex: 1; }
        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(to bottom, var(--primary-color), var(--primary-dark));
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            margin-top: 10px;
        }
        .btn:hover {
            background: linear-gradient(to bottom, var(--primary-dark), var(--primary-color));
            transform: translateY(-2px);
        }
        .success-message { display: none; text-align: center; padding: 30px; color: var(--success-color); }
        .success-message i { font-size: 50px; margin-bottom: 15px; }
        .error { color: var(--danger-color); font-size: 14px; margin-top: 5px; display: none; }

        /* ✅ Back Button Style */
        .back-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow);
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .back-btn i {
            font-size: 0.9rem;
        }
        .success-message {
    display: none;
    text-align: center;
    padding: 30px;
    color: var(--success-color);
    background: var(--light-bg);
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 18px;
    line-height: 1.6;
}
.success-message i {
    font-size: 40px;
    display: block;
    margin-bottom: 10px;
}

    </style>
</head>
<body>
    <div id="confirmationMessage" class="message"></div>

    <div class="overlay">
        <div class="container">
            <div class="header">
                <h2>QuickPay Payment Gateway</h2>
                <p>Secure payment processing for Animal Guardian Pro</p>
                <p><strong>Donor:</strong> <span id="donor-name"></span></p>
            </div>

            <div id="confirmationMessage" class="success-message"></div>

            <div class="amount-display">
                Payment Amount: R<span id="payment-amount-display">0.00</span>
            </div>

            <div class="form-container" id="payment-form">
                <div class="form-group">
                    <label for="card">Card Number</label>
                    <div class="input-group">
                        <input type="text" id="card" placeholder="1234 5678 9012 3456" maxlength="19">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <div class="error" id="card-error">Please enter a valid card number</div>
                </div>

                <div class="flex-group">
                    <div class="form-group">
                        <label for="expiry">Expiry Date</label>
                        <div class="input-group">
                            <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
                            <i class="fas fa-calendar"></i>
                        </div>
                        <div class="error" id="expiry-error">Please enter a valid expiry date</div>
                    </div>

                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <div class="input-group">
                            <input type="text" id="cvv" placeholder="123" maxlength="4">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="error" id="cvv-error">Please enter a valid CVV</div>
                    </div>
                </div>

                <button class="btn" id="pay-btn">
                    <i class="fas fa-lock"></i> Pay Now
                </button>
            </div>

            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i>
                <h2>Payment Successful!</h2>
                <p>Thank you, <span id="success-name"></span>!</p>
                <p>Your payment of R<span id="success-amount">0.00</span> was processed successfully.</p>

                <!-- ✅ Back Button -->
                <button class="back-btn" id="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </button>
            </div>
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const amountParam = urlParams.get('amount');
            const nameParam = urlParams.get('name');

            const amount = amountParam ? parseFloat(amountParam).toFixed(2) : '0.00';
            document.getElementById('payment-amount-display').textContent = amount;
            document.getElementById('success-amount').textContent = amount;
            if (nameParam) {
                document.getElementById('donor-name').textContent = decodeURIComponent(nameParam);
                document.getElementById('success-name').textContent = decodeURIComponent(nameParam);
            }

            const cardInput = document.getElementById('card');
            cardInput.addEventListener('input', function () {
                let value = this.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
                if (value.length > 0) value = value.match(/.{1,4}/g).join(' ');
                this.value = value;
            });

            const expiryInput = document.getElementById('expiry');
            expiryInput.addEventListener('input', function () {
                let value = this.value.replace(/\D/g, '');
                if (value.length > 2) value = value.substring(0, 2) + '/' + value.substring(2, 4);
                this.value = value;
            });

            document.getElementById('pay-btn').addEventListener('click', function () {
                if (validateForm()) {
                    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                    this.disabled = true;
                    setTimeout(() => {
                        document.getElementById('payment-form').style.display = 'none';
                        document.getElementById('success-message').style.display = 'block';
                    }, 2000);
                }
            });

            // ✅ Back button function
            document.getElementById('back-btn').addEventListener('click', function () {
                window.location.href = "admin dashboard.php"; // Change to your homepage file if different
            });

            function validateForm() {
                let isValid = true;
                const cardRegex = /^[0-9]{4} [0-9]{4} [0-9]{4} [0-9]{4}$/;
                const cardError = document.getElementById('card-error');
                if (!cardRegex.test(cardInput.value)) { cardError.style.display = 'block'; isValid = false; } 
                else cardError.style.display = 'none';

                const expiryRegex = /^(0[1-9]|1[0-2])\/([0-9]{2})$/;
                const expiryError = document.getElementById('expiry-error');
                if (!expiryRegex.test(expiryInput.value)) { expiryError.style.display = 'block'; isValid = false; } 
                else expiryError.style.display = 'none';

                const cvvInput = document.getElementById('cvv');
                const cvvRegex = /^[0-9]{3,4}$/;
                const cvvError = document.getElementById('cvv-error');
                if (!cvvRegex.test(cvvInput.value)) { cvvError.style.display = 'block'; isValid = false; } 
                else cvvError.style.display = 'none';

                return isValid;
            }
        });
   </script>
  <script>
  const params = new URLSearchParams(window.location.search);
  const amount = parseFloat(params.get("amount"));

  const messageBox = document.getElementById("confirmationMessage");
  messageBox.style.display = "block"; // Show the message box

  let message = `<i>✔</i><br>Thank you for your payment of <strong>R${amount.toFixed(2)}</strong>.`;

  if (amount > 500) {
    message += `<br><br><span style="color: var(--accent-color); font-weight: bold;">🌟 Your generous contribution is deeply appreciated. You've made a real impact!</span>`;
  }

  messageBox.innerHTML = message;
</script>


</body>
</html>
