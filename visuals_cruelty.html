<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruelty Reports Dashboard</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
            color: #134f5c;
        }

        .overlay {
            background: rgba(19,79,92,0.85);
            padding: 30px;
            border-radius: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 25px;
            color: #134f5c;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            height: 400px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters select, .filters input {
            padding: 10px;
            border: 1px solid #134f5c;
            border-radius: 8px;
            background: white;
        }

        .btn {
            display: inline-block;
            background: #134f5c;
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-right: 10px;
        }

        .btn:hover {
            background: #0f3f4a;
        }

        .back-btn {
            background: #60a5b3;
        }

        .back-btn:hover {
            background: #3d8a95;
        }

        .summary-cards {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: #e9f7fe;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            min-width: 200px;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
        }

        .card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #134f5c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #428bca;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="container">
            <h1>Cruelty Reports Analytics Dashboard</h1>
            
            <div class="summary-cards">
                <div class="card">
                    <h3>Total Reports</h3>
                    <div class="number" id="total-reports">0</div>
                </div>
                <div class="card">
                    <h3>Most Common Cruelty Type</h3>
                    <div class="number" id="common-cruelty">-</div>
                </div>
                <div class="card">
                    <h3>Most Reported Animal</h3>
                    <div class="number" id="common-animal">-</div>
                </div>
            </div>

            <div class="filters">
                <select id="time-filter">
                    <option value="all">All Time</option>
                    <option value="month">This Month</option>
                    <option value="week">This Week</option>
                </select>
                
                <select id="animal-filter">
                    <option value="all">All Animals</option>
                    <option value="dog">Dogs</option>
                    <option value="cat">Cats</option>
                    <option value="livestock">Livestock</option>
                    <option value="wildlife">Wildlife</option>
                </select>
                
                <select id="cruelty-filter">
                    <option value="all">All Cruelty Types</option>
                    <option value="neglect">Neglect</option>
                    <option value="abuse">Abuse</option>
                    <option value="abandonment">Abandonment</option>
                    <option value="hoarding">Hoarding</option>
                    <option value="fighting">Fighting</option>
                </select>
                
                <button class="btn" onclick="loadCharts()">Apply Filters</button>
            </div>

            <div class="dashboard-grid">
                <div class="chart-container" id="cruelty_chart"></div>
                <div class="chart-container" id="animal_chart"></div>
                <div class="chart-container" id="timeline_chart"></div>
                <div class="chart-container" id="location_chart"></div>
            </div>

            <h2>Recent Reports</h2>
            <div id="reports-table"></div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="admind.php" class="btn back-btn">Back to Dashboard</a>
                <button class="btn" onclick="exportData()">Export Report Data</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // Load Google Charts
        google.charts.load('current', {'packages':['corechart', 'bar']});
        google.charts.setOnLoadCallback(loadCharts);

        // Function to load all charts
        function loadCharts() {
            // Get filter values
            const timeFilter = document.getElementById('time-filter').value;
            const animalFilter = document.getElementById('animal-filter').value;
            const crueltyFilter = document.getElementById('cruelty-filter').value;
            
            // Fetch data from server with filters
            fetch(`getCrueltyData.php?time=${timeFilter}&animal=${animalFilter}&cruelty=${crueltyFilter}`)
                .then(response => response.json())
                .then(data => {
                    // Update summary cards
                    document.getElementById('total-reports').textContent = data.summary.total_reports;
                    document.getElementById('common-cruelty').textContent = data.summary.common_cruelty;
                    document.getElementById('common-animal').textContent = data.summary.common_animal;
                    
                    // Draw charts
                    drawCrueltyTypeChart(data.cruelty_types);
                    drawAnimalTypeChart(data.animal_types);
                    drawTimelineChart(data.timeline);
                    drawLocationChart(data.locations);
                    
                    // Update reports table
                    updateReportsTable(data.recent_reports);
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        // Draw Cruelty Type Pie Chart
        function drawCrueltyTypeChart(data) {
            const chartData = new google.visualization.DataTable();
            chartData.addColumn('string', 'Cruelty Type');
            chartData.addColumn('number', 'Count');
            chartData.addRows(data);

            const options = {
                title: 'Distribution of Cruelty Types',
                is3D: true,
                pieHole: 0.4,
                colors: ['#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4']
            };

            const chart = new google.visualization.PieChart(document.getElementById('cruelty_chart'));
            chart.draw(chartData, options);
        }

        // Draw Animal Type Bar Chart
        function drawAnimalTypeChart(data) {
            const chartData = new google.visualization.DataTable();
            chartData.addColumn('string', 'Animal Type');
            chartData.addColumn('number', 'Reports');
            chartData.addRows(data);

            const options = {
                title: 'Reports by Animal Type',
                chartArea: {width: '60%'},
                hAxis: {
                    title: 'Number of Reports',
                    minValue: 0
                },
                vAxis: {
                    title: 'Animal Type'
                },
                colors: ['#4363d8']
            };

            const chart = new google.visualization.BarChart(document.getElementById('animal_chart'));
            chart.draw(chartData, options);
        }

        // Draw Timeline Chart
        function drawTimelineChart(data) {
            const chartData = new google.visualization.DataTable();
            chartData.addColumn('string', 'Month');
            chartData.addColumn('number', 'Reports');
            chartData.addRows(data);

            const options = {
                title: 'Reports Over Time',
                curveType: 'function',
                legend: { position: 'bottom' },
                colors: ['#e6194b']
            };

            const chart = new google.visualization.LineChart(document.getElementById('timeline_chart'));
            chart.draw(chartData, options);
        }

        // Draw Location Chart
        function drawLocationChart(data) {
            const chartData = new google.visualization.DataTable();
            chartData.addColumn('string', 'Location');
            chartData.addColumn('number', 'Reports');
            chartData.addRows(data);

            const options = {
                title: 'Reports by Location',
                pieHole: 0.4,
            };

            const chart = new google.visualization.PieChart(document.getElementById('location_chart'));
            chart.draw(chartData, options);
        }

        // Update Reports Table
        function updateReportsTable(reports) {
            let tableHtml = `
                <table>
                    <tr>
                        <th>Date</th>
                        <th>Reporter</th>
                        <th>Animal Type</th>
                        <th>Cruelty Type</th>
                        <th>Location</th>
                    </tr>
            `;

            reports.forEach(report => {
                tableHtml += `
                    <tr>
                        <td>${report.date}</td>
                        <td>${report.reporter_name}</td>
                        <td>${report.animal_type}</td>
                        <td>${report.cruelty_type}</td>
                        <td>${report.location}</td>
                    </tr>
                `;
            });

            tableHtml += '</table>';
            document.getElementById('reports-table').innerHTML = tableHtml;
        }

        // Export Data Function
        function exportData() {
            // This would typically generate a CSV or PDF report
            alert('Export functionality would be implemented here. This would generate a report based on current filters.');
        }

        // Refresh data every 5 minutes
        setInterval(loadCharts, 300000);
    </script>
</body>
</html>
